databases:
  - name: miau-db
    databaseName: miau_db_postgres
    user: miau_user_render
    plan: free
    region: oregon

services:
  # 1. Backend Laravel API (Docker con php artisan serve ultra rapido)
  - type: web
    name: miau-backend
    runtime: docker
    dockerfilePath: ./backend2_laravel/Dockerfile
    dockerContext: ./backend2_laravel
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "MIAU 2026"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:kQOq7YwB3jKzN1vX9pL4mR8tU2vC5eF0aD6bH8jM2gE=
      - key: APP_URL
        value: https://miau-backend-qs21.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: miau-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

  # 2. Frontend Vue 3 SPA (Static Site nativo en Render)
  - type: web
    name: miau-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://miau-backend-qs21.onrender.com/api
